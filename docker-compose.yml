version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: splitbuddy-db
    environment:
      POSTGRES_USER: splitbuddy
      POSTGRES_PASSWORD: splitbuddy
      POSTGRES_DB: splitbuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitbuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
