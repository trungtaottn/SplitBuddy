version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: splitbuddy-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-splitbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-splitbuddy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-splitbuddy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: splitbuddy-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-splitbuddy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-splitbuddy}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 8080
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: splitbuddy-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
