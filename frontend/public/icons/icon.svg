<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- Beer mug icon -->
  <g fill="white">
    <!-- Mug body -->
    <rect x="130" y="160" width="180" height="220" rx="20" ry="20"/>
    <!-- Handle -->
    <path d="M310 200 C360 200 380 240 380 280 C380 320 360 360 310 360 L310 320 C340 320 340 240 310 240 Z"/>
    <!-- Foam bubbles -->
    <circle cx="180" cy="140" r="25"/>
    <circle cx="220" cy="130" r="30"/>
    <circle cx="265" cy="135" r="28"/>
    <!-- Foam base -->
    <rect x="130" y="150" width="180" height="30" rx="10"/>
  </g>
  <!-- Dollar sign for split -->
  <g fill="#F97316">
    <circle cx="380" cy="140" r="50" fill="white"/>
    <text x="380" y="160" text-anchor="middle" font-size="60" font-weight="bold" fill="#F97316">$</text>
  </g>
</svg>

