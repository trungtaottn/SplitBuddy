<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background - Vintage Paper Style (Sepia) -->
  <rect width="512" height="512" fill="#F4F1E8" rx="80"/>
  
  <defs>
    <!-- Sepia gradient for beer glass -->
    <linearGradient id="sepia-ink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#704214"/>
      <stop offset="100%" style="stop-color:#8B4513"/>
    </linearGradient>
  </defs>
  
  <!-- Beer Glass - Centered Vintage Illustration -->
  <g transform="translate(256, 256)">
    <!-- Glass outline - hand-drawn feel -->
    <path
      d="M-80 -100 L-80 100 Q-80 120 -60 120 L60 120 Q80 120 80 100 L80 -100"
      stroke="url(#sepia-ink)"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    
    <!-- Glass rim - top edge -->
    <path
      d="M-90 -100 L90 -100"
      stroke="url(#sepia-ink)"
      stroke-width="20"
      stroke-linecap="round"
    />
    
    <!-- Handle - vintage style -->
    <path
      d="M80 -60 Q120 -60 120 -20 Q120 20 80 20"
      stroke="url(#sepia-ink)"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    
    <!-- Beer foam - top -->
    <ellipse
      cx="0"
      cy="-100"
      rx="70"
      ry="15"
      fill="#C9BFA8"
      opacity="0.9"
    />
    
    <!-- Foam bubbles - vintage detail -->
    <circle cx="-30" cy="-105" r="8" fill="#F4F1E8" opacity="0.8" />
    <circle cx="0" cy="-110" r="6" fill="#F4F1E8" opacity="0.8" />
    <circle cx="30" cy="-105" r="8" fill="#F4F1E8" opacity="0.8" />
    
    <!-- Beer liquid - sepia tone -->
    <rect
      x="-70"
      y="-80"
      width="140"
      height="160"
      fill="#B8860B"
      opacity="0.6"
      rx="10"
    />
    
    <!-- Liquid highlight - vintage shine -->
    <ellipse
      cx="-20"
      cy="0"
      rx="25"
      ry="50"
      fill="#B8860B"
      opacity="0.3"
    />
    
    <!-- Glass base - bottom detail -->
    <path
      d="M-70 100 Q-50 110 -30 110 L30 110 Q50 110 70 100"
      stroke="url(#sepia-ink)"
      stroke-width="15"
      stroke-linecap="round"
      fill="none"
    />
    
    <!-- Vintage texture lines - hand-drawn feel -->
    <path
      d="M-60 -20 L60 -20"
      stroke="url(#sepia-ink)"
      stroke-width="3"
      stroke-dasharray="5 5"
      opacity="0.3"
    />
    <path
      d="M-60 20 L60 20"
      stroke="url(#sepia-ink)"
      stroke-width="3"
      stroke-dasharray="5 5"
      opacity="0.3"
    />
  </g>
</svg>
