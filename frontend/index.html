<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- SEO & Performance -->
    <meta name="description" content="Ứng dụng chia tiền nhậu thông minh cho hội bạn bè. Theo dõi chi tiêu, chia tiền công bằng, quản lý công nợ dễ dàng." />
    <meta name="keywords" content="chia tiền, chia bill, nhậu, split bill, expense tracker, công nợ" />
    <meta name="author" content="SplitBuddy" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SplitBuddy - Chia tiền nhậu" />
    <meta property="og:description" content="Ứng dụng chia tiền nhậu thông minh cho hội bạn bè" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:locale" content="vi_VN" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#F97316" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SplitBuddy" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="SplitBuddy" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    
    <!-- DNS prefetch for API -->
    <link rel="dns-prefetch" href="//api.splitbuddy.vn" />
    
    <title>SplitBuddy - Chia tiền nhậu thông minh</title>
    
    <!-- Critical CSS for initial load -->
    <style>
      /* Critical CSS for fast first paint */
      html { 
        font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(to bottom, hsl(30, 50%, 98%), hsl(30, 40%, 95%));
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(to bottom, hsl(222, 47%, 11%), hsl(222, 47%, 8%));
        }
      }
      #root {
        min-height: 100vh;
      }
      /* Loading spinner for initial load */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: inherit;
      }
      .initial-loader::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid hsl(24, 95%, 50%);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading spinner -->
      <div class="initial-loader" aria-label="Loading..."></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
