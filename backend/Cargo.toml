[package]
name = "splitbuddy"
version = "0.1.0"
edition = "2021"
authors = ["SplitBuddy Team"]
description = "Backend API for SplitBuddy - Bill splitting application"
default-run = "splitbuddy"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "request-id", "util", "compression-gzip"] }
tower_governor = "0.4"

# WebSocket
tokio-tungstenite = "0.21"

# Async Runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"

# Authentication
jsonwebtoken = "9"
argon2 = "0.5"
base64 = "0.21"
sha2 = "0.10"

# Types
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
rust_decimal = { version = "1.33", features = ["serde", "serde-with-str"] }

# Caching
moka = { version = "0.12", features = ["future"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

# Error Handling
thiserror = "1"
anyhow = "1"

# Configuration
dotenvy = "0.15"

# HTTP Client (for OpenAI)
reqwest = { version = "0.11", features = ["json"] }

# Web Push (for push notifications)
web-push = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# OpenAPI / Swagger
utoipa = { version = "4", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }

# Memory Allocator (optional, recommended for production)
tikv-jemallocator = { version = "0.5", optional = true }

[features]
default = ["jemalloc"]
jemalloc = ["tikv-jemallocator"]

[dev-dependencies]
tokio-test = "0.4"

# ============================================
# Build Profiles - Optimized for Speed
# ============================================

# Development: Fast compile times
[profile.dev]
opt-level = 0
debug = true
incremental = true
# Optimize dependencies even in dev mode (they rarely change)
[profile.dev.package."*"]
opt-level = 2

# Release: Balanced between compile time and runtime performance
[profile.release]
opt-level = 3
debug = false
incremental = false
# Use thin LTO instead of full LTO (much faster compile, 90% of the benefit)
lto = "thin"
# Keep 16 codegen units for faster compile (default was 1)
codegen-units = 16
# Strip debug symbols to reduce binary size
strip = true

# Production: Maximum optimization (use for final deployment)
[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

