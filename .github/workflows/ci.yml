name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Required permissions for pushing to revert branch
permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  # ============================================
  # Backend: Lint and Type Check
  # ============================================
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
            
      - name: Check formatting
        run: cargo fmt -- --check
        
      - name: Clippy
        run: cargo clippy --release -- -D warnings

  # ============================================
  # Backend: Build and Test
  # ============================================
  test-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
          
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-
      
      - name: Cache cargo target directory
        uses: actions/cache@v4
        with:
          path: backend/target/
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('backend/Cargo.lock', 'backend/src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-
            
      - name: Build
        run: cargo build --release
        
      - name: Run tests
        run: cargo test --release

  # ============================================
  # Frontend: Lint and Build
  # ============================================
  test-frontend:
    runs-on: ubuntu-latest
    # Run in parallel with lint-backend (no dependency)
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      
      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: frontend/dist
          key: ${{ runner.os }}-frontend-build-${{ hashFiles('frontend/src/**/*', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-build-
          
      - name: Install dependencies
        run: npm ci
        
      - name: Type check
        run: npm run type-check || true
        
      - name: Build
        run: npm run build

  # ============================================
  # Security Scan (Docker Image) - Optional, runs in parallel with deploy
  # ============================================
  security-scan:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: splitbuddy:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          # Only build if cache miss (faster)
          no-cache: false
          
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'splitbuddy:scan'
          format: 'table'
          exit-code: '0'  # Don't fail on vulnerabilities, just report
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ============================================
  # Deploy to Heroku (main branch only)
  # ============================================
  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      previous_commit: ${{ steps.save-commit.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Only fetch last 2 commits (enough for HEAD~1)
      
      - name: Save previous commit hash
        id: save-commit
        run: |
          # Get the commit hash before current HEAD (parent commit)
          PREVIOUS_COMMIT=$(git rev-parse HEAD~1)
          echo "hash=$PREVIOUS_COMMIT" >> $GITHUB_OUTPUT
          echo "📌 Saved previous commit: $PREVIOUS_COMMIT"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: echo $HEROKU_API_KEY | docker login --username=_ --password-stdin registry.heroku.com
        
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
          provenance: false
          sbom: false
          build-args: |
            RUST_BUILD_MODE=release
          # Optimize build: use GitHub Actions cache for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
            
      - name: Install Heroku CLI
        run: |
          # Always install Heroku CLI (fast operation, ensures it's available)
          if ! command -v heroku &> /dev/null; then
            echo "📦 Installing Heroku CLI..."
            curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          else
            echo "✅ Heroku CLI already available"
          fi
          heroku --version
      
      - name: Release to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          set -e  # Exit on any error
          echo "🚀 Releasing Docker image to Heroku..."
          
          # Heroku CLI automatically uses HEROKU_API_KEY from environment
          # Release the container using Heroku CLI
          heroku container:release web --app "$HEROKU_APP_NAME"
          
          echo "✅ Release command completed successfully"
      
      - name: Verify Deployment
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          echo "🔍 Verifying deployment..."
          
          # Wait for app to start
          sleep 10
          
          # Check app health (with retries)
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$HEROKU_APP_NAME.herokuapp.com/api/health" || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ App is healthy! (HTTP $HTTP_STATUS)"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "⏳ Attempt $RETRY_COUNT/$MAX_RETRIES: App not ready yet (HTTP $HTTP_STATUS), waiting..."
              sleep 10
            fi
          done
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "⚠️ Warning: Could not verify app health (HTTP $HTTP_STATUS)"
            echo "This may be normal if the app takes longer to start"
          fi
            
      - name: Deployment Summary
        run: |
          echo "🚀 Deployed to Heroku: https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com"
          echo "📦 Docker image: registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web"

  # ============================================
  # Sync revert branch (on deploy success)
  # ============================================
  sync-revert-success:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.deploy.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Sync current main to revert branch
        run: |
          echo "✅ Deploy thành công → Cập nhật revert branch = main hiện tại"
          
          # Fetch only revert branch (faster)
          git fetch origin revert:revert 2>/dev/null || true
          
          # Get current commit hash
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "📌 Current commit: $CURRENT_COMMIT"
          
          # Checkout or create revert branch
          if git show-ref --verify --quiet refs/remotes/origin/revert; then
            git checkout -b revert origin/revert 2>/dev/null || git checkout revert
          else
            git checkout -b revert
          fi
          
          # Reset revert to current main
          git reset --hard origin/main
          
          # Push to revert branch
          git push origin revert --force
          
          echo "✅ Revert branch đã được cập nhật = main hiện tại ($CURRENT_COMMIT)"

  # ============================================
  # Sync revert branch (on deploy failure)
  # ============================================
  sync-revert-failure:
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.deploy.result == 'failure'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Sync previous commit to revert branch
        run: |
          echo "❌ Deploy thất bại → Cập nhật revert branch = commit trước đó"
          
          # Fetch only revert branch (faster)
          git fetch origin revert:revert 2>/dev/null || true
          
          # Get previous commit (parent of current HEAD)
          PREVIOUS_COMMIT=$(git rev-parse HEAD~1)
          echo "📌 Previous commit: $PREVIOUS_COMMIT"
          
          # Checkout or create revert branch
          if git show-ref --verify --quiet refs/remotes/origin/revert; then
            git checkout -b revert origin/revert 2>/dev/null || git checkout revert
          else
            git checkout -b revert
          fi
          
          # Reset revert to previous commit
          git reset --hard $PREVIOUS_COMMIT
          
          # Push to revert branch
          git push origin revert --force
          
          echo "✅ Revert branch đã được cập nhật = commit trước đó ($PREVIOUS_COMMIT)"
          echo "💡 Bạn có thể dùng revert branch để rollback nếu cần"
