name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required permissions for pushing to revert branch and reading PR files
permissions:
  contents: write
  actions: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  # Faster Rust builds
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  # ============================================
  # Detect changes for conditional job execution
  # ============================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for PR comparison
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/src/**'
              - 'frontend/package*.json'
              - 'frontend/vite.config.ts'
              - 'frontend/tsconfig*.json'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
            ci:
              - '.github/workflows/**'
            docs-only:
              - 'docs/**'
              - 'README.md'
              - 'LICENSE'
              - 'AGENTS.md'
              - '*.md'

  # ============================================
  # Cross-cutting guardrails
  # ============================================
  guardrails:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          cache-on-failure: true
          shared-key: "rust-guardrails"

      - name: Money guardrails
        run: |
          ! grep -E '\bf(32|64)\b|from_f64|Decimal::from_str\(&amount' backend/src/domain/recurring_expense.rs backend/src/api/recurring_expenses.rs backend/src/repository/recurring_expense_repo.rs backend/src/scheduler.rs
          ! grep -R -E 'unwrap\(|expect\(|panic!' backend/src/api backend/src/config.rs backend/src/main.rs
          ! grep -E 'parseFloat|:\s*any|as any|Record<string, any>' frontend/src/components/BillInput.tsx frontend/src/components/NotificationBell.tsx frontend/src/components/NotificationDropdown.tsx frontend/src/components/feed/ActivityItem.tsx frontend/src/components/layout/AppLayout.tsx frontend/src/components/profile/PersonaEditor.tsx frontend/src/contexts/FeatureFlagsContext.tsx frontend/src/contexts/MusicContext.tsx frontend/src/contexts/WebSocketContext.tsx frontend/src/hooks/useFeed.ts frontend/src/hooks/useFormValidation.ts frontend/src/pages/DashboardPage.tsx frontend/src/pages/SessionDetailPage.tsx frontend/src/pages/session/DebtBreakdown.tsx frontend/src/pages/DebtsPage.tsx frontend/src/pages/GroupDebtsPage.tsx frontend/src/pages/session/ImportExportModal.tsx frontend/src/pages/session/RecurringExpenses.tsx frontend/src/lib/api.ts frontend/src/types/api.ts frontend/src/types/websocket.ts frontend/src/utils/sounds.ts

      - name: Foundation authz and WebSocket tests
        working-directory: ./backend
        run: |
          SQLX_OFFLINE=true cargo test authz
          SQLX_OFFLINE=true cargo test ws::tests

      - name: Session file-size guard
        run: |
          wc -l backend/src/repository/session_repo.rs backend/src/api/sessions/mod.rs backend/src/api/ws.rs backend/src/api/recurring_expenses.rs frontend/src/contexts/WebSocketContext.tsx frontend/src/types/websocket.ts
          test $(wc -l < backend/src/repository/session_repo.rs) -le 400
          test $(wc -l < backend/src/api/sessions/mod.rs) -le 120

  # ============================================
  # Backend: Lint (runs in parallel with test-backend)
  # ============================================
  lint-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          cache-on-failure: true
          shared-key: "rust-lint"
      
      - name: Check formatting
        run: cargo fmt -- --check
        
      - name: Clippy
        run: cargo clippy --release -- -D warnings

  # ============================================
  # Backend: Build and Test (runs in parallel with lint-backend)
  # ============================================
  test-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      # Use Swatinem/rust-cache for registry/git cache
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          cache-on-failure: true
          shared-key: "rust-cache"
      
      # sccache for compiler caching (40-60% faster)
      # Note: continue-on-error because GitHub cache service can be temporarily unavailable
      # DISABLED due to GitHub Actions Cache Service outage (HTTP 400)
      # - name: Setup sccache
      #   id: sccache
      #   uses: mozilla-actions/sccache-action@v0.0.6
      #   continue-on-error: true
      
      # - name: Configure sccache (if available)
      #   if: steps.sccache.outcome == 'success'
      #   run: |
      #     echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      #     echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
      #     echo "✅ sccache enabled"
      
      # - name: Fallback without sccache
      #   if: steps.sccache.outcome != 'success'
      #   run: |
      #     echo "⚠️ sccache setup failed, continuing without compiler cache"
      #     echo "RUSTC_WRAPPER=" >> $GITHUB_ENV
      
      # mold linker (30-50% faster linking)
      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true
      
      # Install cargo-nextest for faster tests
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      
      - name: Update version (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --tags || true
          bash scripts/update-version.sh
        
      - name: Build
        run: cargo build --release
        
      - name: Run tests
        run: cargo nextest run --release

  # ============================================
  # Frontend: Lint and Build
  # ============================================
  test-frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=moderate
      
      - name: Update version (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --tags || true
          node scripts/update-version.js
        
      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint
      
      - name: Build
        run: npm run build

      - name: Money guardrails
        working-directory: .
        run: |
          ! grep -E '\bf(32|64)\b|from_f64|Decimal::from_str\(&amount' backend/src/domain/recurring_expense.rs backend/src/api/recurring_expenses.rs backend/src/repository/recurring_expense_repo.rs backend/src/scheduler.rs
          ! grep -R -E 'unwrap\(|expect\(|panic!' backend/src/api backend/src/config.rs backend/src/main.rs
          ! grep -E 'parseFloat|:\s*any|as any|Record<string, any>' frontend/src/components/BillInput.tsx frontend/src/components/NotificationBell.tsx frontend/src/components/NotificationDropdown.tsx frontend/src/components/feed/ActivityItem.tsx frontend/src/components/layout/AppLayout.tsx frontend/src/components/profile/PersonaEditor.tsx frontend/src/contexts/FeatureFlagsContext.tsx frontend/src/contexts/MusicContext.tsx frontend/src/contexts/WebSocketContext.tsx frontend/src/hooks/useFeed.ts frontend/src/hooks/useFormValidation.ts frontend/src/pages/DashboardPage.tsx frontend/src/pages/SessionDetailPage.tsx frontend/src/pages/session/DebtBreakdown.tsx frontend/src/pages/DebtsPage.tsx frontend/src/pages/GroupDebtsPage.tsx frontend/src/pages/session/ImportExportModal.tsx frontend/src/pages/session/RecurringExpenses.tsx frontend/src/lib/api.ts frontend/src/types/api.ts frontend/src/types/websocket.ts frontend/src/utils/sounds.ts

  # ============================================
  # Deploy to Heroku (main branch only)
  # ============================================
  deploy:
    needs: [changes, guardrails, lint-backend, test-backend, test-frontend]
    # Run if all tests pass OR if tests were skipped (no changes)
    if: |
      always() && 
      github.ref == 'refs/heads/main' && 
      github.event_name == 'push' &&
      (needs.lint-backend.result == 'success' || needs.lint-backend.result == 'skipped') &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped') &&
      (needs.guardrails.result == 'success' || needs.guardrails.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      previous_commit: ${{ steps.save-commit.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Save previous commit hash
        id: save-commit
        run: |
          PREVIOUS_COMMIT=$(git rev-parse HEAD~1)
          echo "hash=$PREVIOUS_COMMIT" >> $GITHUB_OUTPUT
          echo "📌 Saved previous commit: $PREVIOUS_COMMIT"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: echo $HEROKU_API_KEY | docker login --username=_ --password-stdin registry.heroku.com
        
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
          provenance: false
          sbom: false
          build-args: |
            RUST_BUILD_MODE=release
          cache-from: type=gha
          cache-to: type=gha,mode=max
            
      - name: Install Heroku CLI
        run: |
          if ! command -v heroku &> /dev/null; then
            echo "📦 Installing Heroku CLI..."
            curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          fi
          heroku --version
      
      - name: Release to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          set -e
          echo "🚀 Releasing Docker image to Heroku..."
          heroku container:release web --app "$HEROKU_APP_NAME"
          echo "✅ Release command completed successfully"
      
      - name: Verify Deployment
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          echo "🔍 Verifying deployment..."
          sleep 10
          
          for i in 1 2 3; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$HEROKU_APP_NAME.herokuapp.com/api/health" || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ App is healthy! (HTTP $HTTP_STATUS)"
              exit 0
            fi
            
            echo "⏳ Attempt $i/3: App not ready yet (HTTP $HTTP_STATUS), waiting..."
            sleep 10
          done
          
          echo "⚠️ Warning: Could not verify app health (HTTP $HTTP_STATUS)"
            
      - name: Deployment Summary
        run: |
          echo "🚀 Deployed to Heroku: https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com"
          echo "📦 Docker image: registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web"

  # ============================================
  # Security Scan (Optional, runs on schedule or manual)
  # ============================================
  security-scan:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    # Only run on main push, can be disabled for faster deploys
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true  # Don't block deploy on security scan
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: splitbuddy:scan
          cache-from: type=gha
          provenance: false
          
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'splitbuddy:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ============================================
  # Sync revert branch (on deploy success)
  # ============================================
  sync-revert-success:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.deploy.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Sync to revert branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "✅ Deploy thành công → Cập nhật revert branch"
          
          git fetch origin revert:revert 2>/dev/null || true
          
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "📌 Current commit: $CURRENT_COMMIT"
          
          if git show-ref --verify --quiet refs/remotes/origin/revert; then
            git checkout -b revert origin/revert 2>/dev/null || git checkout revert
          else
            git checkout -b revert
          fi
          
          git reset --hard origin/main
          git push origin revert --force
          
          echo "✅ Revert branch = main ($CURRENT_COMMIT)"

  # ============================================
  # Sync revert branch (on deploy failure)
  # ============================================
  sync-revert-failure:
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.deploy.result == 'failure'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Sync to revert branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "❌ Deploy thất bại → Giữ commit trước đó"
          
          git fetch origin revert:revert 2>/dev/null || true
          
          PREVIOUS_COMMIT=$(git rev-parse HEAD~1)
          echo "📌 Previous commit: $PREVIOUS_COMMIT"
          
          if git show-ref --verify --quiet refs/remotes/origin/revert; then
            git checkout -b revert origin/revert 2>/dev/null || git checkout revert
          else
            git checkout -b revert
          fi
          
          git reset --hard $PREVIOUS_COMMIT
          git push origin revert --force
          
          echo "✅ Revert branch = $PREVIOUS_COMMIT"
          echo "💡 Dùng revert branch để rollback nếu cần"
