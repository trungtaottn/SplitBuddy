name: Cache Cleanup

on:
  schedule:
    # Run every 3 days at 3:00 AM UTC (10:00 AM Vietnam time)
    - cron: '0 3 */3 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "🧹 Starting cache cleanup for $GH_REPO..."
          
          # Get all caches
          CACHES=$(gh api repos/$GH_REPO/actions/caches --paginate -q '.actions_caches | sort_by(.last_accessed_at) | reverse')
          TOTAL=$(echo "$CACHES" | jq 'length')
          
          echo "📦 Found $TOTAL caches"
          
          if [ "$TOTAL" -le 1 ]; then
            echo "✅ Only 1 or fewer caches exist. Nothing to clean."
            exit 0
          fi
          
          # Keep only the most recent cache for each key prefix
          # Delete caches older than 3 days (259200 seconds)
          CUTOFF_SECONDS=259200
          NOW=$(date +%s)
          DELETED=0
          
          echo "$CACHES" | jq -c '.[]' | while read cache; do
            CACHE_ID=$(echo "$cache" | jq -r '.id')
            CACHE_KEY=$(echo "$cache" | jq -r '.key')
            LAST_ACCESSED=$(echo "$cache" | jq -r '.last_accessed_at')
            SIZE_BYTES=$(echo "$cache" | jq -r '.size_in_bytes')
            SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
            
            # Convert ISO date to epoch
            ACCESSED_EPOCH=$(date -d "$LAST_ACCESSED" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S" "${LAST_ACCESSED%.*}" +%s 2>/dev/null || echo "0")
            AGE_SECONDS=$((NOW - ACCESSED_EPOCH))
            AGE_DAYS=$((AGE_SECONDS / 86400))
            
            if [ "$AGE_SECONDS" -gt "$CUTOFF_SECONDS" ]; then
              echo "🗑️  Deleting: $CACHE_KEY (${SIZE_MB}MB, ${AGE_DAYS} days old)"
              gh api repos/$GH_REPO/actions/caches/$CACHE_ID -X DELETE || true
              DELETED=$((DELETED + 1))
            else
              echo "✅ Keeping: $CACHE_KEY (${SIZE_MB}MB, ${AGE_DAYS} days old)"
            fi
          done
          
          echo ""
          echo "🎉 Cleanup complete!"
